let REL = null, L = "en";
function applica(l) {

  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t[e.dataset.t]; });
  const a = document.getElementById("dl"), v = document.getElementById("ver");
  if (REL) {
    a.href = REL.url; a.textContent = t.dlv.replace("{v}", REL.v);
    v.textContent = t.mb.replace("{m}", REL.mb) + " · " + t.ver;
  } else { a.textContent = t.dl; v.textContent = t.ver; }
}

  REL = { url: z.browser_download_url, v: r.tag_name.replace(/^v/, ""), mb: (z.size / 1048576).toFixed(1) };
